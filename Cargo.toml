[package]
name = "adaptive-goal-graph"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Bounded, deterministic shadow planning and evidence-integrity contracts for adaptive goal graphs"
readme = "README.md"
repository = "https://github.com/nplongx/adaptive-goal-graph"
keywords = ["adaptive-goal-graph", "planning", "graph-search", "evidence-integrity"]
categories = ["algorithms", "data-structures"]

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
workflow-domain = { version = "=0.2.0", path = "vendor/workflow-domain" }
protocol-contracts = { version = "=0.2.0", path = "vendor/protocol-contracts" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
